name: Integration

# Sends real events to PostHog. Kept off pull requests so an upstream
# outage can never block a merge; it runs on main, nightly, and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  live:
    name: Live API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: stable
      - run: dart pub get
      - name: Run integration tests
        env:
          # A PostHog project key can only send events and read flags, so it
          # is a variable, not a secret. The tests skip themselves when it is
          # unset, so forks and contributors are never blocked.
          POSTHOG_TEST_API_KEY: ${{ vars.POSTHOG_TEST_API_KEY }}
          POSTHOG_TEST_HOST: ${{ vars.POSTHOG_TEST_HOST }}
        run: dart test --tags integration --run-skipped
